<!DOCTYPE html>
<html>

<head>
  <title>Noir</title>

  <style>

    body{
      margin:0;
      background:#0a0a0a;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      width:340px;
      background:#151515;
      border-radius:25px;
      padding:30px;
      text-align:center;
      box-shadow:0 0 40px rgba(138,44,255,0.3);
    }

    h1{
      color:#b26cff;
      font-size:55px;
      margin:0;
    }

    p{
      color:#999;
      margin-top:10px;
    }

    input{
      width:100%;
      padding:15px;
      margin-top:25px;
      border:none;
      border-radius:12px;
      background:#222;
      color:white;
      font-size:15px;
    }

    button{
      width:100%;
      padding:15px;
      margin-top:20px;
      border:none;
      border-radius:12px;
      background:#8a2cff;
      color:white;
      font-size:16px;
    }

  </style>
</head>

<body>

<div class="card">

  <h1>NOIR</h1>

  <p>Secure Private Chat</p>

  <input placeholder="Invite Code">

  <button>Join Chat</button>

</div>

</body>

</html>
